version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: monthly
    groups:
      production:
        dependency-type: production
        patterns:
          - "*"
      development:
        dependency-type: development
        patterns:
          - "*"
    open-pull-requests-limit: 2
