# Managed by code-standards; regenerate with `code-standards show ci --output .github/workflows/standards.yml`.
name: Standards

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          enable-cache: true
          cache-dependency-glob: |
            .sarj-standards.toml
            **/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install JavaScript dependencies
        run: corepack enable && yarn install --immutable --mode=skip-build
        working-directory: "typescript"
      - name: Run standards
        env:
          # A push can follow an intentional history cutover whose previous SHA
          # no longer exists. Pull requests still use their merge base; pushes
          # run the complete repository audit.
          SARJ_STANDARDS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: uvx --no-config --isolated --python 3.14 --from sarj-standards-bootstrap code-standards check --trust-repository-code --format github
