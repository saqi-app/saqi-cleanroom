name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/scripts/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format-build:
    name: Lint, Format & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test deployment classification scripts
        working-directory: .
        run: |
          node .github/scripts/configure-ops-secrets.test.mjs
          .github/scripts/affected-artifacts.test.sh
          .github/scripts/successful-deployment-base.test.sh

      - name: Resolve affected artifacts
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash ../.github/scripts/affected-artifacts.sh ci "$BASE_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: typescript/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        id: yarn-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: typescript/.yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('typescript/yarn.lock', 'typescript/.yarnrc.yml', 'typescript/.yarn/releases/yarn-4.16.0.cjs') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Save Yarn cache
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: typescript/.yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

      - name: Reject high and critical dependency advisories
        if: steps.changes.outputs.dependency_audit == 'true'
        run: yarn audit:high

      - name: Build local runtime dependencies
        if: steps.changes.outputs.crawler_only == 'true'
        run: >-
          yarn workspace @saqi/source-adapter build &&
          yarn workspace @saqi/precedent-iso build &&
          yarn workspace @saqi/crawler-local build

      - name: Build libraries
        if: steps.changes.outputs.crawler_only != 'true'
        run: yarn build:api

      - name: Lint, format and type-check local runtime
        if: steps.changes.outputs.crawler_only == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          yarn workspace @saqi/source-adapter check &&
          yarn workspace @saqi/crawler-local check

      - name: Lint, format and type-check workspaces
        if: steps.changes.outputs.crawler_only != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn check:built

      - name: Test local runtime
        if: steps.changes.outputs.crawler_only == 'true'
        run: >-
          yarn workspace @saqi/source-adapter test &&
          yarn workspace @saqi/crawler-local test

      - name: Test workspaces
        if: steps.changes.outputs.crawler_only != 'true'
        run: yarn test:built

      - name: Find unused code
        run: yarn knip

      - name: Build the operations artifact
        if: steps.changes.outputs.app == 'true'
        run: yarn workspace @saqi/app build

      - name: Build the public artifact
        if: steps.changes.outputs.site == 'true'
        run: yarn workspace @saqi/site build
